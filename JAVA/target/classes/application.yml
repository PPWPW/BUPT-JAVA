spring:
  datasource:
    url: jdbc:h2:file:./data/jeiqidb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8887

game:
  tcp-port: 8888
  move-timeout-seconds: 60
  network-delay-tolerance-ms: 5000
  no-capture-draw-rounds: 40
  max-repeated-check: 6
